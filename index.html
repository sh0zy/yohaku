    <meta name="theme-color" content="#F7F7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)" />

    <title>余白 — 課題を、静かに整える</title>
    <script>
      // 描画前にテーマを決めて、ちらつきを防ぐ
      try {
        var pref = localStorage.getItem('yohaku:theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
